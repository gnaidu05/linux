# Declarative user accounts baked into the image.
# Format (one per line):  username:role:Full Name
#   role = admin    -> member of sudo + adm groups
#   role = user     -> standard unprivileged desktop user
# Lines starting with # are ignored.
#
# Every account is created with the initial password from DEFAULT_PASSWORD
# below and is forced to change it at first login (chage -d 0).
# The root account is LOCKED — all privileged work goes through sudo.

admin:admin:System Administrator
user:user:Standard User

# Initial password applied to all accounts above (must satisfy pwquality
# once changed; this bootstrap value only works for the forced first login).
DEFAULT_PASSWORD="ChangeMe!2026"
