# SecureOS build configuration
# Sourced by build.sh — shell syntax, KEY="value"

# Identity
DISTRO_NAME="SecureOS"
DISTRO_VERSION="1.0"
DISTRO_HOSTNAME="secureos"

# Base system
DEBIAN_SUITE="bookworm"          # Debian 12 (stable)
DEBIAN_MIRROR="http://deb.debian.org/debian"
DEBIAN_SECURITY_MIRROR="http://security.debian.org/debian-security"
ARCH="amd64"

# Locale / time
LOCALE="en_US.UTF-8"
TIMEZONE="UTC"
KEYMAP="us"

# Output
WORK_DIR="${WORK_DIR:-$PWD/work}"
OUT_DIR="${OUT_DIR:-$PWD/out}"
ISO_LABEL="SECUREOS"

# Desktop environment: gnome | xfce
DESKTOP="xfce"

# Optional heavyweight security tooling (adds build time and image size)
ENABLE_CLAMAV="yes"              # ClamAV antivirus
ENABLE_AIDE="no"                 # AIDE file-integrity (init DB on first boot is slow)
