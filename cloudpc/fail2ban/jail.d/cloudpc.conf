# fail2ban jail for the CloudPC login endpoint.
# __AUTH_LOG__ is replaced with the real path by scripts/host-security.sh.
[cloudpc-auth]
enabled = true
filter = cloudpc-auth
logpath = __AUTH_LOG__
maxretry = 10
findtime = 10m
bantime = 1h
# Docker published ports bypass the INPUT chain; ban in DOCKER-USER via
# the forward-aware action so bans actually take effect for port 443.
banaction = iptables-allports[chain="DOCKER-USER"]
