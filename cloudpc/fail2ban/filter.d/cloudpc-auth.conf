# fail2ban filter for the CloudPC auth portal log
# Log lines look like:
#   2026-07-19 19:20:31 cloudpc-auth LOGIN-FAIL user=admin ip=203.0.113.7
#   2026-07-19 19:20:35 cloudpc-auth LOGIN-LOCKED user=admin ip=203.0.113.7
[Definition]
# fail2ban strips the leading timestamp (datepattern) before failregex runs
failregex = ^\s*cloudpc-auth (?:LOGIN-FAIL(?:\s\S+)?|LOGIN-LOCKED|VERIFY-DENY\s\S+) user=\S+ ip=<HOST>$
ignoreregex =
datepattern = ^%%Y-%%m-%%d %%H:%%M:%%S
