<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CloudPC — Change password</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; display: flex; min-height: 100vh;
         align-items: center; justify-content: center; margin: 0;
         background: #101418; color: #e8eaed; }
  .card { background: #1b2127; padding: 2.2rem 2.6rem; border-radius: 12px;
          box-shadow: 0 8px 30px rgba(0,0,0,.45); width: 22rem; }
  h1 { font-size: 1.2rem; margin: 0 0 .6rem; }
  p.rules { font-size: .8rem; color: #9aa4ae; margin: 0 0 1rem; }
  label { display: block; font-size: .85rem; margin: .8rem 0 .25rem; color: #9aa4ae; }
  input { width: 100%; box-sizing: border-box; padding: .55rem .7rem;
          border-radius: 8px; border: 1px solid #333c44; background: #0e1216;
          color: inherit; font-size: 1rem; }
  button { margin-top: 1.3rem; width: 100%; padding: .6rem; border: 0;
           border-radius: 8px; background: #2f6fed; color: white;
           font-size: 1rem; cursor: pointer; }
  .err { background: #3a1d20; border: 1px solid #7a2e34; color: #ffb4b4;
         padding: .6rem .8rem; border-radius: 8px; font-size: .85rem;
         margin-bottom: .6rem; }
  .notice { background: #2b2413; border: 1px solid #6d5c1e; color: #ffe08a;
            padding: .6rem .8rem; border-radius: 8px; font-size: .85rem;
            margin-bottom: .8rem; }
</style>
</head>
<body>
  <form class="card" method="post" action="/change-password" autocomplete="off">
    <h1>Change password</h1>
    {% if forced %}
      <div class="notice">You must set a new password before using your desktop.</div>
    {% endif %}
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <p class="rules">{{ rules }}</p>
    <label for="c">Current password</label>
    <input id="c" name="current" type="password" required maxlength="128">
    <label for="n">New password</label>
    <input id="n" name="new" type="password" required minlength="12" maxlength="128">
    <label for="n2">Repeat new password</label>
    <input id="n2" name="confirm" type="password" required minlength="12" maxlength="128">
    <button type="submit">Set new password</button>
  </form>
</body>
</html>
